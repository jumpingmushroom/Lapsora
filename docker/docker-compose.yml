services:
  lapsora:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - TZ=${TZ:-UTC}
    env_file:
      - ../.env
    # Healthcheck is defined in the image (Dockerfile HEALTHCHECK) so it applies
    # to all deployments, including Unraid `docker run`. Compose inherits it.
    restart: unless-stopped
